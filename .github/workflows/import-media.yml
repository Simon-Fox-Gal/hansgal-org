name: One-time approved public media import
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    if: github.run_number == 1
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Import only manifest-approved public files
        run: python scripts/import_public_assets.py
      - name: Commit verified media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if ! git diff --cached --quiet; then
            git commit -m "Import original public assets with SHA-256 verification"
            git push
          fi
