name: Build and publish review
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: node tests/catalogue.test.cjs
      - name: Build for the configured Pages address
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_HOST: ${{ steps.pages.outputs.host }}
        run: |
          if [ "$SITE_HOST" = "hansgal.org" ] || [ "$SITE_HOST" = "www.hansgal.org" ]; then
            python scripts/build.py --base-path "$SITE_BASE_PATH" --production
          else
            python scripts/build.py --base-path "$SITE_BASE_PATH"
          fi
      - run: python scripts/verify.py
      - run: python tests/mission.py
      - run: python tests/i18n-completion.py
      - run: node tests/language.test.cjs
      - run: node tests/donations.test.cjs
      - run: python tests/recordings.py
      - run: python tests/purchase-audit.py
      - run: python tests/edition.py
      - run: python tests/editorial.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
