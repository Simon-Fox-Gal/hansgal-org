<section class="photos-page"><p class="eyebrow">{{ tr('The archive','Das Archiv') }}</p><h1>{{ tr('Photographs','Fotografien') }}</h1>{% for key,group in photos.items() %}<section class="photo-group"><h2>{{ key }}</h2><div class="photo-grid">{% for p in group %}<a class="imagesItem" rel="group{{ p.photos_category_id }}" href="/storage/photos/{{ p.filename }}" title="{{ p.title|e }}"><img loading="lazy" src="/storage/photos/{{ p.filename }}" alt="{{ p.title|e }}"><span>{{ p.title }}</span></a>{% endfor %}</div></section>{% endfor %}</section>
