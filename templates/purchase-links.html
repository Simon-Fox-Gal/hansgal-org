{% if purchase_links %}
<section aria-label="{{ tr('Obtain music','Noten und Aufnahmen beziehen') }}">
  <h3>{{ tr('Where to buy or listen','Bezugs- und Hörmöglichkeiten') }}</h3>
  <ul>{% for link in purchase_links %}<li><a href="{{ link.url|e }}" target="_blank" rel="noopener noreferrer">{{ link.label|e }} · {{ link.host|e }} ↗</a></li>{% endfor %}</ul>
</section>
{% endif %}
