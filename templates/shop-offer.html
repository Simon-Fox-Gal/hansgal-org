{% set offer=shop_offer(shop_recording) %}{% if offer %}<aside class="hgs-shop-offer" aria-label="{{ shop_text.shop|e }}"><span class="hgs-shop-label">{{ shop_text.shop }}</span><p>{{ shop_text.invitation }}</p><div class="hgs-shop-actions"><strong>£{{ offer.price }}</strong><button type="button" data-add-cd="{{ offer.id }}">{{ shop_text.add }}</button></div><small>{{ shop_text.postage_extra }}</small><span class="hgs-shop-status" role="status"></span></aside>{% endif %}
