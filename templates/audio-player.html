<section class="listening-now" id="listening-now" hidden aria-label="{{ tr('Now playing','Aktuelle Hörprobe') }}"><div><div class="player-window-tools"><button type="button" id="minimise-listening" aria-expanded="true">{{ tr("Minimise","Verkleinern") }}</button><button type="button" id="mini-play" hidden>{{ tr("Pause","Pause") }}</button><button type="button" id="close-listening" aria-label="{{ tr('Close player','Player schließen') }}">×</button></div><img id="now-cover" class="now-cover" src="/app/audio-placeholder.svg" alt="" width="88" height="88"><p class="eyebrow" style="color:white">{{ tr('On the music stand','Auf dem Notenpult') }}</p><h2 id="now-title"></h2><p id="now-track"></p><p id="now-credit" class="now-credit"></p><a id="now-recording" hidden></a><div class="player-controls"><button type="button" id="previous-excerpt">← {{ tr('Previous','Zurück') }}</button><button type="button" id="next-excerpt">{{ tr('Next','Weiter') }} →</button><button type="button" id="popout-listening">{{ tr("Listen while browsing ↗","Beim Weitersurfen hören ↗") }}</button><a id="now-work" hidden>{{ tr('About this work','Über dieses Werk') }}</a></div></div><div><audio id="listening-player" controls preload="none"></audio><p id="player-message" role="status"></p><p class="popout-hint">{{ tr("Opens a small player window, or a separate tab on your phone.","Öffnet ein kleines Player-Fenster oder einen separaten Tab auf dem Smartphone.") }}</p><label><input type="checkbox" id="continuous-listening">{{ tr('Continue to the next excerpt','Nächste Hörprobe automatisch abspielen') }}</label></div></section>

<script type="application/json" id="audio-page-data">{{ audiosamples|tojson }}</script>
<script defer src="/app/audio-player.js"></script>
